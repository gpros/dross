<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4f46e5" />
<title>Food Tracker</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="stylesheet" href="styles.css" />

<!-- Sign-in screen: the password prompt is rendered here by auth.js until unlocked. -->
<div id="signin-screen" class="signin-screen" hidden></div>

<!-- App shell: shown once authenticated. Log is the base screen; Foods/History (and Dishes,
     folded into the Foods popup) open as a bottom-sheet popup inside #page-host. -->
<div id="app" class="app" hidden>
  <main class="views">
    <section id="view-log" class="view" data-view="log"></section>
    <section id="view-exercise-log" class="view" data-view="exercise-log" hidden></section>
  </main>

  <!-- Popup host: a bottom sheet that slides over the Log screen. Closed via an X or backdrop.
       History uses the top header; the Foods/Dishes catalog uses the fixed bottom bar instead. -->
  <div id="page-host" class="page-host" hidden>
    <div class="modal page" role="dialog" aria-modal="true">
      <div class="page-head" id="page-head-top">           <!-- History: title + close -->
        <div id="page-head-left"></div>
        <button id="page-close-top" class="iconbtn" aria-label="Close">✕</button>
      </div>
      <div class="page-body">
        <section id="view-foods" class="view" data-view="foods" hidden></section>
        <section id="view-dishes" class="view" data-view="dishes" hidden></section>
        <section id="view-history" class="view" data-view="history" hidden></section>
        <section id="view-exercises" class="view" data-view="exercises" hidden></section>
        <section id="view-workouts" class="view" data-view="workouts" hidden></section>
      </div>
      <div class="page-foot" id="page-foot" hidden>         <!-- Catalog: segment + controls + close -->
        <div class="page-foot-head">
          <div id="catalog-seg"></div>                     <!-- Foods|Dishes segment, or Exercises title -->
          <button id="page-close-foot" class="iconbtn" aria-label="Close">✕</button>
        </div>
        <div id="catalog-controls"></div>                  <!-- active view's controls -->
      </div>
    </div>
  </div>

  <!-- Persistent bottom tab bar: switches the base page between Food and Exercise entry. -->
  <nav class="tabbar" id="tabbar">
    <button class="tab-btn" data-page="food" aria-selected="true">🍽<span class="tab-label">Food</span></button>
    <button class="tab-btn" data-page="exercise" aria-selected="false">🏋<span class="tab-label">Exercise</span></button>
  </nav>
</div>

<!-- Toast host -->
<div id="toast-host" class="toast-host" aria-live="polite" aria-atomic="true"></div>

<!-- Modal host (targets editor, food editor, quantity prompt) -->
<div id="modal-host" class="modal-host" hidden></div>

<script type="module" src="app.js"></script>
